    <main>
        <h1>Contact Us</h1>
        <p style="text-align: center;">Have a question or want to order ahead? Reach out to us!</p>
        
        <form class="contact-form" onsubmit="event.preventDefault(); window.alert('Thank you for reaching out! We will reply soon.');">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required placeholder="Enter your name">
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">
            
            <label for="message">Message/Order:</label>
            <textarea id="message" name="message" rows="5" required placeholder="What would you like to order?"></textarea>
            
            <button type="submit">Send Message</button>
        </form>
    </main>
